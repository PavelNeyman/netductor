# Portable subset — runs on netductor (containers) and GitHub Actions.
name: ci
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.22-bookworm   # netductor + GHA
    steps:
      - uses: actions/checkout@v4
      - name: Go test
        run: |
          if [ -f go.mod ]; then go test ./...; else echo "no go.mod"; fi
