# Copy to .github/workflows/ci.yml
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22.x" }
      - run: bash scripts/check-version-pins.sh
      - run: go test ./...
      - name: go build
        run: |
          go build -o /tmp/netductor ./cmd/netductor
          go build -o /tmp/netductor-op ./cmd/netductor-op
          go build -o /tmp/netductor-tg ./cmd/netductor-tg
          go build -o /tmp/netductor-agent ./cmd/netductor-agent
          /tmp/netductor version | grep -q node
          /tmp/netductor-op version | grep -q operator
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude=G204,G304,G301,G306 ./...
      - uses: golangci/golangci-lint-action@v6
        with: { version: v1.61, args: --timeout=5m }
