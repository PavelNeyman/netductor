# Copy to .github/workflows/release-netductor.yml (needs workflow-scoped token/PAT)
name: Release netductor
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build binaries
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          LD="-s -w -X main.version=${VER}"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LD" \
              -o dist/netductor-linux-$arch ./cmd/netductor
          done
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LD" \
                -o dist/netductor-op-${os}-${arch} ./cmd/netductor-op
            done
          done
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist/netductor-tg-linux-$arch ./cmd/netductor-tg
          done
          for arch in amd64 arm64 arm mipsle; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$LD" \
              -o dist/netductor-agent-linux-$arch ./cmd/netductor-agent || true
          done
          cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            | Asset | Role |
            | netductor-op-* | Operator workstation |
            | netductor-linux-* | Node on VPS |
            | netductor-agent-linux-* | Edge |
            | netductor-tg-linux-* | Telegram |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
