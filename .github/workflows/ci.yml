name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: go test
        run: go test ./...
      - name: go build
        run: |
          go build -o /tmp/netductor ./cmd/netductor
          go build -o /tmp/netductor-tg ./cmd/netductor-tg
          go build -o /tmp/netductor-agent ./cmd/netductor-agent
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude=G204,G304,G301,G306 ./...
