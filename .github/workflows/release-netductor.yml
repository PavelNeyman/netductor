# Build and publish netductor + netductor-tg + netductor-agent on version tags.
name: Release netductor

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # netductor CLI — linux + darwin (brew)
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=${VER}" \
                -o dist/netductor-${os}-${arch} ./cmd/netductor
            done
          done
          # Telegram bot — linux
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist/netductor-tg-linux-$arch ./cmd/netductor-tg
          done
          # Edge agent — linux multi-arch
          for arch in amd64 arm64 arm mipsle; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VER}" \
              -o dist/netductor-agent-linux-$arch ./cmd/netductor-agent || true
          done
          cd dist && sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'rc') }}
          files: dist/*
          body: |
            ## Netductor ${{ github.ref_name }}

            **Workstation deploy centre** (Mac/PC TUI): primary / secondary / OpenWrt / cameras.

            | Asset | Use |
            |-------|-----|
            | `netductor-darwin-arm64` / `amd64` | Mac CLI + TUI (`brew` / manual) |
            | `netductor-linux-*` | VPS control plane |
            | `netductor-agent-linux-*` | OpenWrt edge |
            | `netductor-tg-linux-*` | Telegram bot |

            ```bash
            # Mac
            brew reinstall netductor
            netductor tui --mode workstation
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
