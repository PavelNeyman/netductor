# Build and publish node + operator + tg + agent on version tags.
name: Release netductor

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          LD="-s -w -X main.version=${VER}"
          # Node control plane — linux only (VPS)
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "$LD" \
              -o dist/netductor-linux-$arch ./cmd/netductor
          done
          # Operator workstation — darwin + linux
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "$LD" \
                -o dist/netductor-op-${os}-${arch} ./cmd/netductor-op
            done
          done
          # Telegram bot — linux
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" \
              -o dist/netductor-tg-linux-$arch ./cmd/netductor-tg
          done
          # Edge agent — linux multi-arch
          for arch in amd64 arm64 arm mipsle; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "$LD" \
              -o dist/netductor-agent-linux-$arch ./cmd/netductor-agent || true
          done
          cd dist && sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'rc') }}
          files: dist/*
          body: |
            ## Netductor ${{ github.ref_name }}

            **Two control-plane binaries (v0.9+):**

            | Asset | Role |
            |-------|------|
            | `netductor-op-darwin-*` / `netductor-op-linux-*` | **Operator** workstation — deploy, TUI, `operator serve` |
            | `netductor-linux-*` | **Node** on VPS — install, serve, vpn, doctor, secondary, edge |
            | `netductor-agent-linux-*` | OpenWrt edge agent |
            | `netductor-tg-linux-*` | Telegram bot |

            Deploy from the Mac downloads **only** `netductor-linux-*` onto the VPS.

            ```bash
            # Mac
            install netductor-op-darwin-arm64 as netductor-op
            netductor-op tui
            netductor-op deploy fleet --primary-host … --secondary-host …
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
