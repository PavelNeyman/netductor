name: netductor
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.26-bookworm
      options: --user 1001:1001
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
      GOFLAGS: -buildvcs=false
      HOME: /tmp
      GOPATH: /tmp/go
      GOCACHE: /tmp/go-cache
      GOMODCACHE: /tmp/go/pkg/mod
      GOBIN: /tmp/go/bin
      TMPDIR: /var/tmp/netductor-test-tmp
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: deps
        run: |
          set -euo pipefail
          go mod download
      - name: version pins
        run: |
          set -euo pipefail
          if [ -f scripts/check-version-pins.sh ]; then bash scripts/check-version-pins.sh; fi
      - name: go test
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          chmod 700 "$TMPDIR"
          go test ./...
      - name: go vet
        run: |
          set -euo pipefail
          go vet ./...
      - name: staticcheck
        run: |
          set -euo pipefail
          mkdir -p "$GOBIN"
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$GOBIN/staticcheck" -checks=SA ./...
      - name: go build linux
        run: |
          set -euo pipefail
          go build -o /tmp/netductor ./cmd/netductor
          go build -o /tmp/netductor-op ./cmd/netductor-op
          go build -o /tmp/netductor-tg ./cmd/netductor-tg
          go build -o /tmp/netductor-agent ./cmd/netductor-agent
          /tmp/netductor version | grep -q node
      - name: macOS operator cross-build
        run: |
          set -euo pipefail
          GOOS=darwin GOARCH=amd64 go build -o /tmp/netductor-op-darwin-amd64 ./cmd/netductor-op
          GOOS=darwin GOARCH=arm64 go build -o /tmp/netductor-op-darwin-arm64 ./cmd/netductor-op
          ls -la /tmp/netductor-op-darwin-*
