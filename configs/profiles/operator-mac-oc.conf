# netductor + OpenConnect (Mac) — Shadowrocket Config mode
# Install: open URL from Telegram or copy into Shadowrocket → Config
# Order: connect OpenConnect first, then enable this config (Global Routing = Config)

[General]
skip-proxy = 10.1.253.0/24, 10.2.27.0/24, 172.28.0.0/16, 172.30.0.0/16, 172.80.80.0/24, 192.168.20.0/24, 192.168.40.0/24, 192.168.70.0/24, 192.168.71.0/24, 192.168.80.0/24, 192.168.81.0/24, 134.17.14.99/32, 141.105.71.253/32, 81.177.220.16/32, 192.168.70.250, 192.168.80.250, 10.9.8.0/24, localhost, *.local, *.tealpos.ru
always-real-ip = *
dns-server = system

[Rule]
DOMAIN-SUFFIX,tealpos.ru,DIRECT
IP-CIDR,10.1.253.0/24,DIRECT,no-resolve
IP-CIDR,10.2.27.0/24,DIRECT,no-resolve
IP-CIDR,172.28.0.0/16,DIRECT,no-resolve
IP-CIDR,172.30.0.0/16,DIRECT,no-resolve
IP-CIDR,172.80.80.0/24,DIRECT,no-resolve
IP-CIDR,192.168.20.0/24,DIRECT,no-resolve
IP-CIDR,192.168.40.0/24,DIRECT,no-resolve
IP-CIDR,192.168.70.0/24,DIRECT,no-resolve
IP-CIDR,192.168.71.0/24,DIRECT,no-resolve
IP-CIDR,192.168.80.0/24,DIRECT,no-resolve
IP-CIDR,192.168.81.0/24,DIRECT,no-resolve
IP-CIDR,134.17.14.99/32,DIRECT,no-resolve
IP-CIDR,141.105.71.253/32,DIRECT,no-resolve
IP-CIDR,81.177.220.16/32,DIRECT,no-resolve
IP-CIDR,192.168.70.250/32,DIRECT,no-resolve
IP-CIDR,192.168.80.250/32,DIRECT,no-resolve
IP-CIDR,10.9.8.0/24,DIRECT,no-resolve
FINAL,PROXY
