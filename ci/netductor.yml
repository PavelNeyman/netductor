# Entry workflow for netductor CI on primary VPS (netductor git project build).
# name / file base must match project name = repo name.
name: netductor
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.22-bookworm
    env:
      CGO_ENABLED: "0"
    steps:
      - name: version pins
        run: |
          set -euo pipefail
          if [ -f scripts/check-version-pins.sh ]; then bash scripts/check-version-pins.sh; fi
      - name: go test
        run: |
          set -euo pipefail
          go test ./...
      - name: go build linux
        run: |
          set -euo pipefail
          go build -o /tmp/netductor ./cmd/netductor
          go build -o /tmp/netductor-op ./cmd/netductor-op
          go build -o /tmp/netductor-tg ./cmd/netductor-tg
          go build -o /tmp/netductor-agent ./cmd/netductor-agent
          /tmp/netductor version | grep -q node
  windows-cross:
    runs-on: ubuntu-latest
    container: golang:1.22-bookworm
    env:
      CGO_ENABLED: "0"
    steps:
      - name: windows amd64 cross
        run: |
          set -euo pipefail
          GOOS=windows GOARCH=amd64 go build -o /tmp/netductor-op-windows-amd64.exe ./cmd/netductor-op
          GOOS=windows GOARCH=amd64 go build -o /tmp/netductor-agent-windows-amd64.exe ./cmd/netductor-agent
          ls -la /tmp/*.exe
